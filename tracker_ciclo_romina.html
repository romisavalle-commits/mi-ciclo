<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Ciclo">
<title>Mi Ciclo — Romina</title>
<style>
  :root {
    --purple: #7F77DD; --purple-light: #EEEDFE; --purple-dark: #3C3489;
    --amber: #EF9F27; --amber-light: #FAEEDA; --amber-dark: #633806;
    --green: #639922; --green-light: #EAF3DE; --green-dark: #27500A;
    --teal: #1D9E75; --teal-light: #E1F5EE; --teal-dark: #085041;
    --pink: #D4537E; --pink-light: #FBEAF0; --pink-dark: #72243E;
    --gray-light: #F1EFE8; --gray: #888780; --gray-dark: #2C2C2A;
    --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efe9;
    --text: #1a1a18; --text2: #5f5e5a; --text3: #9e9d98;
    --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
    --radius: 10px; --radius-lg: 14px;
    --success: #27500A; --success-bg: #EAF3DE;
    --danger: #791F1F; --danger-bg: #FCEBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2b;
      --text: #f0efe9; --text2: #b4b2a9; --text3: #6b6a65;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      --amber-light: #3d2a08; --amber-dark: #FAC775;
      --green-light: #1a2e08; --green-dark: #C0DD97;
      --teal-light: #042c1e; --teal-dark: #9FE1CB;
      --pink-light: #2d0f1c; --pink-dark: #F4C0D1;
      --gray-light: #2c2c2a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; max-width: 430px; margin: 0 auto; min-height: 100vh; }
  .topbar { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 12px 16px 10px; position: sticky; top: 0; z-index: 10; }
  .topbar-title { font-size: 17px; font-weight: 600; }
  .topbar-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .status { font-size: 11px; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; }
  .status.ok { background: var(--success-bg); color: var(--success); }
  .status.err { background: var(--danger-bg); color: var(--danger); }
  .status.pending { background: var(--bg3); color: var(--text2); }
  .nav { display: flex; gap: 6px; padding: 10px 16px; background: var(--bg); border-bottom: 0.5px solid var(--border); }
  .nav-btn { padding: 7px 16px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border2); border-radius: 20px; cursor: pointer; background: transparent; color: var(--text2); }
  .nav-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .content { padding: 16px; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px; }
  .fase-card { border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px; }
  .lbl { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 6px; }
  .tip { font-size: 13px; color: var(--text2); line-height: 1.55; padding: 3px 0; display: flex; gap: 8px; }
  .tip::before { content: '·'; flex-shrink: 0; }
  .icon-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .score-btn { width: 52px; height: 52px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .score-btn.sel { border: 2.5px solid var(--purple); background: var(--purple-light); color: var(--purple-dark); }
  .score-hint { font-size: 11px; color: var(--text3); align-self: center; }
  textarea { width: 100%; font-size: 13px; padding: 10px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text); resize: none; font-family: inherit; line-height: 1.5; }
  .save-btn { width: 100%; padding: 13px; font-size: 15px; font-weight: 600; border: none; border-radius: var(--radius); cursor: pointer; background: var(--text); color: var(--bg); margin-top: 10px; }
  .save-btn:active { opacity: 0.8; }
  .pill-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0; }
  .pill { aspect-ratio: 1; border-radius: 50%; border: 0.5px solid var(--border); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; position: relative; cursor: default; }
  .pill.today { border: 2.5px solid var(--text); }
  .pill.has-log::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--text2); position: absolute; bottom: 1px; right: 1px; }
  .pill.p { background: var(--gray-light); color: var(--text2); }
  .pill.f1 { background: var(--amber-light); color: var(--amber-dark); }
  .pill.f2 { background: var(--green-light); color: var(--green-dark); }
  .pill.f3 { background: var(--teal-light); color: var(--teal-dark); }
  .pill.f4 { background: var(--pink-light); color: var(--pink-dark); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .log-row { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .log-date { font-size: 13px; font-weight: 600; }
  .log-fase { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-left: 6px; }
  .log-scores { font-size: 12px; color: var(--text2); margin-top: 4px; display: flex; gap: 12px; }
  .log-nota { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .auth-box { text-align: center; padding: 24px 16px; }
  .auth-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; background: var(--bg); color: var(--text); text-decoration: none; margin-top: 16px; }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .section-sub { font-size: 13px; color: var(--text2); margin-bottom: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Mi ciclo</div>
  <div class="topbar-sub" id="topbar-day">Cargando...</div>
  <div class="status pending" id="status-bar">
    <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>
    <span id="status-text">Iniciando...</span>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" id="nav-hoy" onclick="setScreen('hoy')">Hoy</button>
  <button class="nav-btn" id="nav-ciclo" onclick="setScreen('ciclo')">Ciclo</button>
  <button class="nav-btn" id="nav-hist" onclick="setScreen('hist')">Historial</button>
</div>

<div class="content">
  <div id="screen-hoy" class="screen active"></div>
  <div id="screen-ciclo" class="screen"></div>
  <div id="screen-hist" class="screen"></div>
</div>

<script>
const BLISTER_START = new Date(2026, 3, 27);
const CLIENT_ID = '968923854375-pm9n9o9sebidc61taalfiodmnsjrvdgh.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';
const FILE_NAME = 'tracker_ciclo_romina_v2.json';

let logs = {};
let driveFileId = null;
let accessToken = null;
let selEnergy = null, selAntojo = null, selMood = null;

const TIPS = {
  recuperacion: {
    ali: ['Usá el cuarto de hidratos en el almuerzo (arroz integral, batata o quinoa).','Merienda obligatoria: yogur griego + fruta con cáscara.','Mate con frutos secos para no llegar al almuerzo con hipoglucemia.'],
    eje: ['Movimiento suave: caminata, yoga, elongación.','En gym: fuerza con peso moderado.','Evitar cardio intenso los primeros días.']
  },
  pico: {
    ali: ['El cuarto de hidratos es opcional. Usalo post-entreno si entrenás fuerte.','Priorizá proteína y vegetales.','La merienda podés simplificarla si no hay hambre real.'],
    eje: ['Tu mejor semana para entrenar fuerte.','Fuerza con más peso, cardio de mayor intensidad.','Aprovechá para los entrenamientos más exigentes.']
  },
  bajando: {
    ali: ['Hidratación clave: los 1.5L del plan.','Si aparece antojo: manzana o yogur griego con fruta.','Reservá el cuarto de hidratos para el almuerzo.'],
    eje: ['Fuerza moderada, buen cardio.','Buena fase para entrenamientos funcionales.','Mantener el ritmo sin forzar récords.']
  },
  descenso: {
    ali: ['Usá el cuarto de hidratos sí o sí en el almuerzo.','Merienda obligatoria: yogur griego + fruta con cáscara.','Si el antojo es fuerte, la manzana (colación del plan) está habilitada.'],
    eje: ['Movimiento suave o descanso activo.','Caminata o elongación si tenés gym programado.','El movimiento suave ayuda a reducir el antojo.']
  }
};

function getDayOfCycle(date) {
  const d = new Date(date);
  const localD = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const s = BLISTER_START;
  const localS = new Date(s.getFullYear(), s.getMonth(), s.getDate());
  const diff = Math.floor((localD - localS) / 86400000);
  return ((diff % 28) + 28) % 28 + 1;
}

function getFase(day) {
  if (day <= 4)  return { cls:'p',  color:'#5F5E5A', bg:'#F1EFE8', fase:'descenso',    label:'Descenso · placebo' };
  if (day <= 10) return { cls:'f1', color:'#633806', bg:'#FAEEDA', fase:'recuperacion', label:'Recuperación · días 5–10' };
  if (day <= 18) return { cls:'f2', color:'#27500A', bg:'#EAF3DE', fase:'pico',         label:'Pico de energía · días 11–18' };
  if (day <= 24) return { cls:'f3', color:'#085041', bg:'#E1F5EE', fase:'bajando',      label:'Estabilidad bajando · días 19–24' };
  return             { cls:'f4', color:'#72243E', bg:'#FBEAF0', fase:'descenso',    label:'Descenso · días 25–28' };
}

function dateKey(d) { return new Date(d).toISOString().slice(0,10); }
function today() { return new Date(); }

function setStatus(msg, state) {
  const bar = document.getElementById('status-bar');
  const txt = document.getElementById('status-text');
  if (!bar || !txt) return;
  txt.textContent = msg;
  bar.className = 'status ' + (state === true ? 'ok' : state === false ? 'err' : 'pending');
}

function loadLocal() {
  try { logs = JSON.parse(localStorage.getItem('ciclo_logs') || '{}'); } catch(e) { logs = {}; }
}

function saveLocal() {
  try { localStorage.setItem('ciclo_logs', JSON.stringify(logs)); } catch(e) {}
}

async function driveRequest(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      ...(body ? { 'Content-Type': 'application/json' } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error('Drive API error: ' + res.status);
  return res.json();
}

async function findOrCreateFile() {
  const search = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${FILE_NAME}' and trashed=false&fields=files(id,name)`,
    { headers: { 'Authorization': 'Bearer ' + accessToken } }
  );
  const data = await search.json();
  if (data.files && data.files.length > 0) {
    driveFileId = data.files[0].id;
    const content = await fetch(
      `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
      { headers: { 'Authorization': 'Bearer ' + accessToken } }
    );
    try { logs = await content.json(); } catch(e) { logs = {}; }
    setStatus('Sincronizado con Drive', true);
  } else {
    const meta = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' })
    });
    const f = await meta.json();
    driveFileId = f.id;
    await uploadToDrive();
    setStatus('Archivo creado en Drive', true);
  }
}

async function uploadToDrive() {
  if (!driveFileId || !accessToken) return;
  await fetch(
    `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
    {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(logs)
    }
  );
}

async function saveDay(key) {
  const nota = (document.getElementById('nota-input') || {}).value || '';
  logs[key] = { energy: selEnergy, antojo: selAntojo, mood: selMood, nota, ts: new Date().toISOString() };
  saveLocal();
  renderHoy(); renderCiclo(); renderHistorial();
  if (accessToken && driveFileId) {
    setStatus('Guardando en Drive...', null);
    try {
      await uploadToDrive();
      setStatus('Guardado en Drive', true);
      setTimeout(() => setStatus('Sincronizado con Drive', true), 2000);
    } catch(e) {
      setStatus('Error al guardar en Drive', false);
    }
  } else {
    setStatus('Guardado localmente', null);
  }
}

function renderHoy() {
  const t = today();
  const day = getDayOfCycle(t);
  const fi = getFase(day);
  const tips = TIPS[fi.fase];
  const key = dateKey(t);
  const ex = logs[key] || {};
  selEnergy = ex.energy != null ? ex.energy : null;
  selAntojo = ex.antojo != null ? ex.antojo : null;
  selMood = ex.mood != null ? ex.mood : null;

  const topDay = document.getElementById('topbar-day');
  if (topDay) topDay.textContent = `Día ${day} del ciclo · ${fi.label.split('·')[0].trim()}`;

  const daysLeft = 28 - day + 1;

  document.getElementById('screen-hoy').innerHTML = `
    <div class="fase-card" style="background:${fi.bg};">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;">
        <span style="font-size:28px;font-weight:700;color:${fi.color};">Día ${day}</span>
        <span style="font-size:11px;color:${fi.color};opacity:0.8;">${daysLeft} días para el próximo blíster</span>
      </div>
      <span style="font-size:13px;font-weight:600;color:${fi.color};">${fi.label}</span>
    </div>

    <div class="card">
      <div class="section-title">Alimentación hoy</div>
      ${tips.ali.map(t => `<div class="tip">${t}</div>`).join('')}
      <div class="lbl" style="margin-top:14px;">Ejercicio hoy</div>
      ${tips.eje.map(t => `<div class="tip">${t}</div>`).join('')}
    </div>

    <div class="card">
      <div class="section-title">Registrar hoy</div>
      <div class="lbl">Energía</div>
      <div class="icon-row" id="row-energy">
        ${[1,2,3,4,5].map(n=>`<button class="score-btn${selEnergy==n?' sel':''}" data-type="energy" data-val="${n}">${n}</button>`).join('')}
        <span class="score-hint">1=baja · 5=alta</span>
      </div>
      <div class="lbl">Antojo de dulce</div>
      <div class="icon-row" id="row-antojo">
        ${[1,2,3,4,5].map(n=>`<button class="score-btn${selAntojo==n?' sel':''}" data-type="antojo" data-val="${n}">${n}</button>`).join('')}
        <span class="score-hint">1=sin antojo · 5=mucho</span>
      </div>
      <div class="lbl">Estado de ánimo</div>
      <div class="icon-row" id="row-mood">
        ${[1,2,3,4,5].map(n=>`<button class="score-btn${selMood==n?' sel':''}" data-type="mood" data-val="${n}">${n}</button>`).join('')}
        <span class="score-hint">1=bajo · 5=genial</span>
      </div>
      <div class="lbl">Nota</div>
      <textarea id="nota-input" rows="3" placeholder="¿Cómo te sentiste? ¿Comiste según el plan? ¿Entrenaste?">${ex.nota||''}</textarea>
      <button class="save-btn" id="save-day-btn" data-key="${key}">Guardar</button>
    </div>`;
}

function pick(type, val) {
  if (type==='energy') selEnergy=val;
  if (type==='antojo') selAntojo=val;
  if (type==='mood') selMood=val;
  renderHoy();
}

function renderCiclo() {
  const t = today();
  const todayDay = getDayOfCycle(t);
  let html = `<div class="card">
    <div class="section-title">Tu blíster actual</div>
    <div class="section-sub">Iniciado el 24 de abril · Hoy día ${todayDay}</div>
    <div class="pill-grid">`;
  for (let d=1; d<=28; d++) {
    const fi = getFase(d);
    const isToday = d===todayDay;
    const dDate = new Date(BLISTER_START);
    dDate.setDate(BLISTER_START.getDate()+d-1);
    const hasLog = !!logs[dateKey(dDate)];
    html += `<div class="pill ${fi.cls}${isToday?' today':''}${hasLog?' has-log':''}">${d}</div>`;
  }
  html += `</div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#FAEEDA;border:0.5px solid #EF9F27;"></div> Recuperación</div>
      <div class="legend-item"><div class="legend-dot" style="background:#EAF3DE;border:0.5px solid #97C459;"></div> Pico</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E1F5EE;border:0.5px solid #5DCAA5;"></div> Bajando</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FBEAF0;border:0.5px solid #ED93B1;"></div> Descenso</div>
    </div>
    <p style="font-size:11px;color:var(--text3);margin-top:8px;">Punto = tiene registro · Borde grueso = hoy</p>
  </div>`;
  document.getElementById('screen-ciclo').innerHTML = html;
}

function renderHistorial() {
  const entries = Object.entries(logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);
  let html = '<div class="card">';
  if (!entries.length) {
    html += `<p style="font-size:13px;color:var(--text2);">Todavía no hay registros. Empezá desde "Hoy".</p>`;
  } else {
    html += `<div class="section-title">Historial</div><div class="section-sub">${entries.length} días registrados</div>`;
    for (const [key, log] of entries) {
      const d = new Date(key+'T12:00:00');
      const day = getDayOfCycle(d);
      const fi = getFase(day);
      const dateStr = d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
      html += `<div class="log-row">
        <div><span class="log-date">${dateStr}</span><span class="log-fase" style="background:${fi.bg};color:${fi.color};">Día ${day}</span></div>
        <div class="log-scores">
          <span>Energía ${log.energy||'—'}/5</span>
          <span>Antojo ${log.antojo||'—'}/5</span>
          <span>Ánimo ${log.mood||'—'}/5</span>
        </div>
        ${log.nota ? `<div class="log-nota">${log.nota.slice(0,100)}${log.nota.length>100?'…':''}</div>` : ''}
      </div>`;
    }
  }
  html += '</div>';
  document.getElementById('screen-hist').innerHTML = html;
}

function setScreen(s) {
  ['hoy','ciclo','hist'].forEach(id => {
    document.getElementById('screen-'+id).classList.toggle('active', id===s);
    const btn = document.getElementById('nav-'+id);
    if (btn) btn.className = 'nav-btn' + (id===s?' active':'');
  });
  if (s==='hoy') renderHoy();
  if (s==='ciclo') renderCiclo();
  if (s==='hist') renderHistorial();
}

async function initGoogleAuth() {
  const params = new URLSearchParams(location.hash.replace('#',''));
  const tokenFromHash = params.get('access_token');
  if (tokenFromHash) {
    accessToken = tokenFromHash;
    history.replaceState(null, '', location.pathname);
    sessionStorage.setItem('gtoken', tokenFromHash);
  } else {
    const stored = sessionStorage.getItem('gtoken');
    if (stored) accessToken = stored;
  }

  if (accessToken) {
    setStatus('Conectando con Drive...', null);
    try {
      await findOrCreateFile();
    } catch(e) {
      setStatus('Error con Drive — usando guardado local', false);
    }
  } else {
    setStatus('Sin conexión a Drive — guardado local activo', null);
    const connectBtn = `
      <div class="card auth-box">
        <p style="font-size:14px;font-weight:600;">Conectar con Google Drive</p>
        <p style="font-size:13px;color:var(--text2);margin-top:6px;">Para guardar tus registros en la nube y acceder desde cualquier dispositivo.</p>
        <a class="auth-btn" href="${buildAuthUrl()}" id="auth-link">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.3 9 3.4l6.7-6.7C35.7 2.5 30.2 0 24 0 14.8 0 6.9 5.4 3 13.3l7.8 6C12.7 13.1 17.9 9.5 24 9.5z"/><path fill="#4A90D9" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/><path fill="#FBBC05" d="M10.8 28.7A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7L2.5 13.3A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l8.3-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.1 0-11.3-3.6-13.2-9.2l-8.3 6C6.9 42.6 14.8 48 24 48z"/></svg>
          Conectar con Google
        </a>
        <p style="font-size:11px;color:var(--text3);margin-top:10px;">Tus datos se guardan en un archivo privado en tu propio Drive.</p>
      </div>`;
    const hoyDiv = document.getElementById('screen-hoy');
    if (hoyDiv) hoyDiv.insertAdjacentHTML('afterbegin', connectBtn);
  }
  renderHoy(); renderCiclo(); renderHistorial();
}

function buildAuthUrl() {
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: 'https://romisavalle-commits.github.io/mi-ciclo/tracker_ciclo_romina.html',
    response_type: 'token',
    scope: SCOPES,
    prompt: 'consent'
  });
  return 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

document.addEventListener('touchend', handleClick, {passive: true});
document.addEventListener('click', handleClick);

function handleClick(e) {
  const btn = e.target.closest('[data-type]');
  if (btn) {
    e.preventDefault();
    const type = btn.dataset.type;
    const val = parseInt(btn.dataset.val);
    if (type==='energy') selEnergy=val;
    if (type==='antojo') selAntojo=val;
    if (type==='mood') selMood=val;
    renderHoy();
    return;
  }
  const saveBtn = e.target.closest('#save-day-btn');
  if (saveBtn) {
    e.preventDefault();
    saveDay(saveBtn.dataset.key);
  }
}

loadLocal();
initGoogleAuth();
</script>
</body>
</html>
